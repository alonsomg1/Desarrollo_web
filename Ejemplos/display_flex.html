<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display flex</title>
    <style>
        ul{
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content:space-evenly
        }
        li{
            margin: 0;
            list-style-type: none;
            border: solid black 1px;
        }


    </style> 
</head>
<body>
    <nav>
        <ul>
            <li>Enlace 1</li>
            <li>Enlace 2</li>
            <li>Enlace 3</li>
            <li>Enlace 4</li>
        </ul>
    </nav>
</body>
</html>
