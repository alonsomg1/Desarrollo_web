<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propiedad position</title>
    <style>
        div{
            height: 200px;
            width: 200px;
            border: solid 5px black;
            position: absolute;
        }
        .caja1{
            background-color: red;
            top: 100px;
            left: 100px;
        }
        .caja2{
            background-color: darkblue;
            top: 100px;
            right: 100px;
            z-index: 1;
        }
        .caja3{
            background-color: green;
            top: 200px;
            left: 500px;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="caja1"></div> 
    <div class="caja2"></div>    
    <div class="caja3"></div>    
    
</body>
</html>
