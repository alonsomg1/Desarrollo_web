<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position_relative</title>
    <style>
        div{
            border: solid 5px black;
        }
        .padre{
            position: relative;
            background-color: red;
            height: 300px;
            width: 300px;
        }
        .hijo{
            position: absolute;
            background-color: darkblue;
            height: 50px;
            width: 50px;

            left: 0px;
            bottom: 0px;
        }
    </style>
</head>
<body>
    <div class="padre">
        <div class="hijo"></div>
    </div>
</body>
</html>
